<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee6d8}body{min-height:100svh;display:grid;place-items:center}.stage{min-height:100svh;width:100%;display:grid;place-items:center;background:#eee6d8}.scene{position:relative;width:min(96vw,70.4svh);aspect-ratio:4/5;overflow:hidden;isolation:isolate;background:#e9dfd0}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.base{z-index:0}.card{position:absolute;z-index:2;left:15%;width:70%;top:15%;height:69%;object-fit:contain;transform:translateY(64%);transition:transform 2.1s cubic-bezier(.2,.76,.2,1);box-shadow:0 5px 20px #27261844;background:#eee6d8}.front{z-index:3;clip-path:polygon(0 45%,100% 45%,100% 100%,0 100%)}.flap{position:absolute;inset:0;z-index:4;transform-origin:50% 44%;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.25,.7,.22,1);pointer-events:none;clip-path:polygon(0 0,100% 0,100% 46%,0 46%)}.flap img{width:100%;height:100%;display:block}.seal{position:absolute;z-index:5;width:22%;height:16%;left:39%;top:43%;background-image:url('aligned-cover.jpg');background-size:454.55% 625%;background-position:50% 53%;border-radius:50%;opacity:0;pointer-events:none}.shadows{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:multiply;opacity:.13;transition:opacity .8s}.shadows:before,.shadows:after{content:"";position:absolute;width:60%;height:80%;top:-14%;left:-18%;background:repeating-linear-gradient(116deg,transparent 0 27px,#29341d 30px 43px,transparent 53px 90px);filter:blur(18px);transform-origin:top left;animation:sway 9s ease-in-out infinite alternate;mask-image:linear-gradient(to bottom,#000,transparent 88%)}.shadows:after{left:78%;top:28%;width:35%;height:70%;opacity:.5;animation-duration:12s;animation-direction:alternate-reverse}@keyframes sway{from{transform:rotate(-4deg) translateX(-2%)}to{transform:rotate(4deg) translateX(3%)}}.tap{position:absolute;inset:0;z-index:8;border:0;background:transparent;cursor:pointer;font-size:0}.tap:focus-visible{outline:3px solid #fff;outline-offset:-5px}.controls{position:absolute;z-index:9;bottom:3%;left:0;right:0;display:none;justify-content:center;flex-wrap:wrap;gap:7px;padding:0 10px}.controls a,.controls button{background:#596044;color:#fff;border:1px solid #596044;padding:12px 10px;text-decoration:none;font:10px Arial,sans-serif;letter-spacing:.06em;cursor:pointer}.scene.open .tap{display:none}.scene.open .flap{transform:rotateX(170deg)}.scene.open .card{transform:translateY(-8%);transition-delay:.65s}.scene.open .shadows{opacity:0}.scene.done .controls{display:flex}.scene.done .front,.scene.done .flap{opacity:0;transition:opacity .7s}.scene.done .card{z-index:5;top:4%;left:4%;width:92%;height:85%;transform:none;box-shadow:none;transition:all .8s}.audio{display:none}@media(prefers-reduced-motion:reduce){.shadows:before,.shadows:after{animation:none}.scene.open .flap,.scene.open .card{transition-duration:.01s}}
</style></head><body><main class="stage"><section class="scene" id="scene" aria-label="ALIGNED Summer Edition invitation"><img class="photo base" src="aligned-cover.jpg" alt="Luxury olive green envelope"><img class="card" src="aligned-invitation.jpg" alt="ALIGNED Summer Edition event invitation"><img class="photo front" src="aligned-cover.jpg" alt=""><div class="flap"><img src="aligned-cover.jpg" alt=""></div><div class="shadows" aria-hidden="true"></div><button class="tap" id="tap" aria-label="Open your invitation">Open your invitation</button><nav class="controls" id="controls"><a href="https://www.google.com/maps/search/?api=1&amp;query=251+Brunswick+Rd%2C+Brunswick+VIC+Australia" target="_blank" rel="noopener">View location</a><a href="aligned-summer-edition.ics" download>Add to calendar</a><button id="replay">Replay</button></nav><video class="audio" id="sound" playsinline preload="none"><source src="aligned-opening.mp4" type="video/mp4"></video></section></main><script>
